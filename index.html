<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rasca y Revela — ¡Encuentra el género!</title>
<style>
:root{
  --bg1:#fff7f9;
  --bg2:#f0fbff;
  --card:#fff;
  --accent:#ffe7f0;
  --shadow:0 10px 30px rgba(0,0,0,0.12);
  --radius:14px;
  --font:"Segoe UI", Roboto, "Helvetica Neue", Arial;
}
html,body{
  height:100%;
  margin:0;
  font-family:var(--font);
  background:linear-gradient(135deg,var(--bg1),var(--bg2));
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.wrap{max-width:920px;width:100%;text-align:center;}
header{margin-bottom:14px}
h1{margin:0;font-size:26px;color:#333}
p.lead{margin:6px 0 16px;color:#444}

.board{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  max-width:640px;
  margin:0 auto 18px;
}

.card{
  position:relative;
  background:var(--card);
  border-radius:12px;
  padding:10px;
  box-shadow:var(--shadow);
  overflow:hidden;
  aspect-ratio:1/1;
  touch-action:none;
}

.prize{
  position:absolute;
  inset:10px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:700;
  color:#333;
  user-select:none;
  pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,0.95), rgba(250,250,250,0.9));
  padding:6px;
  text-align:center;
  opacity:0;
  transition: opacity 0.3s ease;
}

canvas{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:block;
  border-radius:inherit;
}

/* Pop-up modal */
#winnerModal{
  position:fixed;
  top:0; left:0; width:100%; height:100%;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.6);
  z-index:2000;
}
#winnerContent{
  position:relative;
  background:#fff;
  border-radius:16px;
  padding:30px 40px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
  font-size:24px;
  color:#333;
}
.firework{
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  background: #ff2a68;
  animation: explode 0.8s ease-out forwards;
}
@keyframes explode{
  0% {transform: scale(1) translate(0,0); opacity:1;}
  100% {transform: scale(2) translate(var(--dx), var(--dy)); opacity:0;}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Rasca y Revela — ¡Encuentra el género!</h1>
    <p class="lead">Rasca los cuadros. Solo si revelas los 3 correctos aparecerá la sorpresa 🎉</p>
  </header>
  <main>
    <div id="board" class="board"></div>
  </main>
</div>

<div id="winnerModal">
  <div id="winnerContent">
    🎉 ¡Poner acá el género! 🎉
  </div>
</div>

<script>
const BOARD = document.getElementById('board');
const MODAL = document.getElementById('winnerModal');

const BRUSH = 5;
const CLEAR_THRESHOLD = 0.90;
const SYMBOLS = ["🎈","🧸","🐣","🍭","🧁","🌟","💤","🍼"];

const WIN_LINES = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

// Escoger aleatoriamente una línea ganadora
const winningLine = WIN_LINES[Math.floor(Math.random()*WIN_LINES.length)];
const prizes = new Array(9).fill(null).map((_,i)=> SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)]);

// Asignar el mensaje de género a los 3 ganadores
winningLine.forEach(i => prizes[i] = "✨");

// Estado de tarjetas ganadoras reveladas
let revealedWins = new Set();

function createBoard(){
  BOARD.innerHTML='';
  for(let i=0;i<9;i++){
    const card = document.createElement('div');
    card.className='card';
    card.dataset.index=i;
    const prize = document.createElement('div');
    prize.className='prize';
    prize.innerHTML = `<div style="font-size:30px">${prizes[i]==="✨" ? " ✨" : prizes[i]}</div>`;
    card.appendChild(prize);
    const cvs = document.createElement('canvas');
    card.appendChild(cvs);
    BOARD.appendChild(card);
    setupCanvas(card,cvs,prize,i);
  }
}

function setupCanvas(card, canvasEl, prizeEl, index){
  const ctx = canvasEl.getContext('2d');
  function fit(){
    const rect = card.getBoundingClientRect();
    canvasEl.width = rect.width;
    canvasEl.height = rect.height;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#C6C6C6';
    ctx.fillRect(0,0,canvasEl.width,canvasEl.height);
  }
  fit(); window.addEventListener('resize', fit);

  let drawing=false;
  function getPos(e){
    const rect = canvasEl.getBoundingClientRect();
    const clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
    const clientY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }
  function touchPrevent(e){ if(e.cancelable) e.preventDefault(); }

  function start(e){ drawing=true; touchPrevent(e); draw(e); }
  function end(e){ drawing=false; checkCleared(); }
  function draw(e){
    if(!drawing) return;
    touchPrevent(e);
    const p = getPos(e);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    ctx.arc(p.x,p.y,BRUSH,0,Math.PI*2);
    ctx.fill();
  }

  canvasEl.addEventListener('mousedown', start);
  canvasEl.addEventListener('mousemove', draw);
  window.addEventListener('mouseup', end);

  canvasEl.addEventListener('touchstart', start,{passive:false});
  canvasEl.addEventListener('touchmove', draw,{passive:false});
  window.addEventListener('touchend', end);

  canvasEl.addEventListener('mouseleave', ()=>{drawing=false; checkCleared();});

  function checkCleared(){
    try{
      const data = ctx.getImageData(0,0,canvasEl.width,canvasEl.height).data;
      let total = data.length/4;
      let countOpaque = 0;
      const step = 8;
      for(let i=3;i<data.length;i+=4*step){
        if(data[i]>16) countOpaque++;
      }
      const ratio = 1 - (countOpaque*step/total);
      if(ratio >= CLEAR_THRESHOLD){
        ctx.clearRect(0,0,canvasEl.width,canvasEl.height);
        canvasEl.style.pointerEvents='none';
        prizeEl.style.opacity=1;
        if(winningLine.includes(index)) {
          revealedWins.add(index);
          if(revealedWins.size === 3){
            showWinnerModal();
          }
        }
      }
    }catch(err){
      canvasEl.style.pointerEvents='none';
      prizeEl.style.opacity=1;
    }
  }
}

function showWinnerModal(){
  MODAL.style.display='flex';
  // Fireworks effect
  for(let i=0;i<40;i++){
    const fw = document.createElement('div');
    fw.className='firework';
    fw.style.setProperty('--dx', (Math.random()*200-100)+'px');
    fw.style.setProperty('--dy', (Math.random()*200-100)+'px');
    fw.style.background = `hsl(${Math.random()*360},100%,60%)`;
    fw.style.left='50%';
    fw.style.top='50%';
    MODAL.appendChild(fw);
    setTimeout(()=>fw.remove(),800);
  }
}

createBoard();
</script>
</body>
</html>
