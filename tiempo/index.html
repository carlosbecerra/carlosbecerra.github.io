<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cuenta Regresiva - Revelación de Bebé</title>

<style>
    body {
        background: linear-gradient(145deg, #ffe6f2, #e0f7ff);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Poppins", sans-serif;
        margin: 0;
        padding: 20px;
        overflow-x: hidden;
    }

    .container {
        text-align: center;
        padding: 40px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 450px;
        position: relative;
        animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
    }

    h1 {
        font-size: 2rem;
        color: #ff87b3;
        margin-bottom: 20px;
        text-shadow: 0 2px 4px rgba(255, 136, 170, 0.5);
    }

    .countdown {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .box {
        background: white;
        padding: 20px;
        width: 100px;
        height: 100px;
        border-radius: 20px;
        font-size: 1.5rem;
        color: #6aaeff;
        font-weight: bold;
        box-shadow: 0 5px 15px rgba(0, 129, 255, 0.2);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .label {
        font-size: 0.9rem;
        margin-top: 8px;
        color: #888;
    }

    /* FLOATING BABY ICONS */
    .stars {
        position: absolute;
        font-size: 2rem;
        animation: twinkle 2s infinite alternate;
        opacity: 0.7;
    }

    @keyframes twinkle {
        0% { opacity: 0.5; transform: scale(1); }
        100% { opacity: 1; transform: scale(1.2); }
    }

    .s1 { top: -20px; left: -20px; }
    .s2 { top: -20px; right: -20px; }
    .s3 { bottom: -20px; left: -10px; }
    .s4 { bottom: -20px; right: -10px; }

    #revealMessage {
        margin-top: 25px;
        font-size: 2rem;
        color: #ff87b3;
        font-weight: bold;
        display: none;
        animation: pop 0.6s ease-out forwards;
    }

    @keyframes pop {
        0% { transform: scale(0.5); opacity: 0; }
        100% { transform: scale(1.2); opacity: 1; }
    }

    /* RESPONSIVE FOR MOBILE */
    @media (max-width: 480px) {
        h1 {
            font-size: 1.6rem;
        }

        .box {
            width: 80px;
            height: 80px;
            font-size: 1.2rem;
            padding: 15px;
        }

        .label {
            font-size: 0.75rem;
        }

        .container {
            padding: 25px;
        }
    }
</style>
</head>

<body>
    <div class="container">
        <div class="stars s1">⭐</div>
        <div class="stars s2">🌙</div>
        <div class="stars s3">💗</div>
        <div class="stars s4">💙</div>

        <h1>La gran revelación será en...</h1>

        <div class="countdown">
            <div class="box">
                <span id="days">00</span>
                <div class="label">Días</div>
            </div>
            <div class="box">
                <span id="hours">00</span>
                <div class="label">Horas</div>
            </div>
            <div class="box">
                <span id="minutes">00</span>
                <div class="label">Minutos</div>
            </div>
            <div class="box">
                <span id="seconds">00</span>
                <div class="label">Segundos</div>
            </div>
        </div>

        <div id="revealMessage">🎉 ¡Llegó el momento! 🎉</div>
    </div>

<script>
    // FECHA Y HORA DE LA REVELACIÓN
    const revealDate = new Date("2025-11-29 16:30:00").getTime();

    const timer = setInterval(() => {
        const now = new Date().getTime();
        const diff = revealDate - now;

        if (diff <= 0) {
            clearInterval(timer);
            document.querySelector(".countdown").style.display = "none";
            document.getElementById("revealMessage").style.display = "block";
            return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / 1000 / 60) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        document.getElementById("days").innerText = days;
        document.getElementById("hours").innerText = hours;
        document.getElementById("minutes").innerText = minutes;
        document.getElementById("seconds").innerText = seconds;

    }, 1000);
</script>

</body>
</html>
